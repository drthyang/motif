#
# Checks every push and publishes the page on GitHub Pages.
#   check:   no co-author line in any commit, types, unit tests, the page build and the MCP bundle.
#   firefox: the browser check (scripts/browser_check.cjs) in Firefox, which cannot be run on the author's Mac.
#   deploy:  the built page to GitHub Pages, from main only, and only once the repository is public.
name: Check and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: The user is the only author (no co-author or "Generated with" line in any commit)
        run: |
          # Attribution lines only (a line that starts so), not the words quoted in a sentence.
          if git log --format=%B | grep -i -E '^[[:space:]]*(co-authored-by:|(🤖[[:space:]]*)?generated with)'; then
            echo "A commit message carries a co-author or 'Generated with' line; MOTIF's commits are the user's alone."
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run
      - run: npm run build
      - run: npm run build:mcp
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright-core@1.61.1
      - run: npx playwright-core install --with-deps firefox
      - name: Browser check in Firefox
        run: |
          npx vite --port 5183 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:5183/ > /dev/null && break; sleep 1; done
          BROWSER=firefox PLAYWRIGHT=$PWD/node_modules/playwright-core timeout 900 node scripts/browser_check.cjs

  deploy:
    needs: [check, firefox]
    if: github.ref == 'refs/heads/main' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
